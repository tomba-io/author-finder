name: Test and push latest version

on:
    push:
        branches:
            - main
            - master
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Format, lint, build and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

    push:
        name: Push Actor to Apify
        needs: test
        # Only publish from the default branch, never from pull requests.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Push Actor to Apify
              id: push
              uses: apify/push-actor-action@v1
              with:
                  token: ${{ secrets.APIFY_TOKEN }}

            - name: Print build details
              run: |
                  echo "Build ${{ steps.push.outputs.build-id }} finished with status ${{ steps.push.outputs.build-status }}"
